name: Render SEMENIT MP4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chromium dependencies
        run: npx remotion browser ensure

      - name: Render MP4
        run: npm run render

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: SEMENIT-Shorts-MP4
          path: out/semenit.mp4
          if-no-files-found: error
          retention-days: 7
